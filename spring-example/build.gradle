// Standalone Gradle project — deliberately NOT part of the root Maven build (this repo's library
// and examples/ are both Maven), and never published anywhere. Its only purpose is a real,
// clickable Spring Boot web app demonstrating every geoserver-client feature through actual UI
// screens (not a generic API-invocation console) against a live GeoServer + PostGIS instance.
// See README.md in this directory to run it.

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'io.github.kimbongjune:geoserver-client:1.1.1'
    // Used only by the Vector Data page's PostGIS flow to create/inspect real tables via JDBC,
    // the same pattern as examples/Ex02_DataStoreAndFeatureType.
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
}

tasks.named('test') {
    useJUnitPlatform()
}
