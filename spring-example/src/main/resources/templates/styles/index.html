<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Styles — geoserver-client explorer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main>
    <h1>Styles</h1>
    <p class="sub">Raw SLD upload, or generated via <code>SldBuilder</code>. Global or workspace-scoped.</p>
    <div class="flash ok" th:if="${ok}" th:text="${ok}"></div>
    <div class="flash err" th:if="${err}" th:text="${err}"></div>

    <form action="/styles" method="get" style="margin-bottom:16px">
        <label style="color:#9aa0a6;font-size:13px">Workspace scope (optional):</label>
        <select name="ws" onchange="this.form.submit()">
            <option value="">-- global --</option>
            <option th:each="w : ${workspaces}" th:value="${w.name}" th:text="${w.name}"
                    th:selected="${w.name == selectedWs}"></option>
        </select>
    </form>

    <div class="form-panel">
        <h3>Generate a style with SldBuilder</h3>
        <form action="/styles/generate" method="post">
            <input type="hidden" name="ws" th:value="${selectedWs}"/>
            <div class="field">
                <label>Style name</label>
                <input type="text" name="name" required placeholder="my_style"/>
            </div>
            <div class="field">
                <label>Layer name (for the FeatureTypeStyle)</label>
                <input type="text" name="layerName" required placeholder="my_layer"/>
            </div>
            <div class="field">
                <label>Symbolizer</label>
                <select name="symbolizer">
                    <option value="point">Point</option>
                    <option value="line">Line</option>
                    <option value="polygon">Polygon</option>
                </select>
            </div>
            <div class="field">
                <label>Color</label>
                <input type="text" name="color" value="#4f8ef7" placeholder="#RRGGBB"/>
            </div>
            <div class="field">
                <label>Size / width</label>
                <input type="number" step="0.5" name="size" value="6"/>
            </div>
            <button class="btn" type="submit">Generate</button>
        </form>
    </div>

    <div class="form-panel">
        <h3>Create from raw SLD XML</h3>
        <form action="/styles/raw" method="post">
            <input type="hidden" name="ws" th:value="${selectedWs}"/>
            <div class="field wide">
                <label>Style name</label>
                <input type="text" name="name" required placeholder="my_raw_style"/>
            </div>
            <div class="field wide">
                <label>SLD body</label>
                <textarea name="sld" rows="6" required>&lt;?xml version="1.0" encoding="UTF-8"?&gt;
&lt;StyledLayerDescriptor version="1.0.0" xmlns="http://www.opengis.net/sld"&gt;
&lt;NamedLayer&gt;&lt;Name&gt;raw_style&lt;/Name&gt;&lt;UserStyle&gt;&lt;Name&gt;raw_style&lt;/Name&gt;
&lt;FeatureTypeStyle&gt;&lt;Rule&gt;&lt;PointSymbolizer&gt;&lt;Graphic&gt;&lt;Mark&gt;
&lt;WellKnownName&gt;circle&lt;/WellKnownName&gt;&lt;Fill&gt;&lt;CssParameter name="fill"&gt;#FF0000&lt;/CssParameter&gt;&lt;/Fill&gt;
&lt;/Mark&gt;&lt;Size&gt;8&lt;/Size&gt;&lt;/Graphic&gt;&lt;/PointSymbolizer&gt;&lt;/Rule&gt;
&lt;/FeatureTypeStyle&gt;&lt;/UserStyle&gt;&lt;/NamedLayer&gt;&lt;/StyledLayerDescriptor&gt;</textarea>
            </div>
            <button class="btn" type="submit">Create</button>
        </form>
    </div>

    <h2>Global styles</h2>
    <table class="datatable">
        <thead><tr><th>Name</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${globalStyles}">
            <td th:text="${s.name}"></td>
            <td class="actions">
                <a class="btn small secondary" target="_blank" th:href="@{'/styles/' + ${s.name} + '/sld'}">View SLD</a>
                <a class="btn small secondary" th:href="@{'/styles/' + ${s.name} + '/edit'}">Edit</a>
                <form th:action="@{'/styles/' + ${s.name} + '/delete'}" method="post">
                    <button class="btn small danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${selectedWs != null and !selectedWs.isEmpty()}">
        <h2>Workspace styles (<span th:text="${selectedWs}"></span>)</h2>
        <table class="datatable">
            <thead><tr><th>Name</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${wsStyles}">
                <td th:text="${s.name}"></td>
                <td class="actions">
                    <a class="btn small secondary" target="_blank" th:href="@{'/styles/' + ${s.name} + '/sld'(ws=${selectedWs})}">View SLD</a>
                    <a class="btn small secondary" th:href="@{'/styles/' + ${s.name} + '/edit'(ws=${selectedWs})}">Edit</a>
                    <form th:action="@{'/styles/' + ${s.name} + '/delete'(ws=${selectedWs})}" method="post">
                        <button class="btn small danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
