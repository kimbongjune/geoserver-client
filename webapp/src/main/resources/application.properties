server.port=8090

# Overridable via env vars (GEOSERVER_URL / GEOSERVER_USERNAME / GEOSERVER_PASSWORD) so no
# credential of any kind — even this repo's well-known local Docker default — sits in a
# checked-in file. Defaults below match docker-compose.yml at the repo root.
geoserver.url=${GEOSERVER_URL:http://localhost:8100/geoserver}
geoserver.username=${GEOSERVER_USERNAME:admin}
geoserver.password=${GEOSERVER_PASSWORD:geoserver}
