name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Skip if SONAR_TOKEN secret is not set (fork PRs, etc.)
    if: ${{ vars.SONAR_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame/new-code detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Start GeoServer + PostGIS
        run: docker compose up -d

      - name: Wait for GeoServer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -u admin:geoserver http://localhost:8100/geoserver/rest/about/version.json > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs; exit 1

      - name: Ensure a default workspace exists
        run: |
          if ! curl -sf -u admin:geoserver http://localhost:8100/geoserver/rest/workspaces/default.json > /dev/null; then
            curl -sf -u admin:geoserver -X POST -H "Content-Type: application/json" \
              -d '{"workspace":{"name":"bootstrap"}}' \
              http://localhost:8100/geoserver/rest/workspaces
            curl -sf -u admin:geoserver -X PUT -H "Content-Type: application/json" \
              -d '{"workspace":{"name":"bootstrap"}}' \
              http://localhost:8100/geoserver/rest/workspaces/default
          fi

      - name: Build with coverage + SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=geoserver-client \
            -Dsonar.organization=kimbongjune \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Stop docker-compose
        if: always()
        run: docker compose down -v
