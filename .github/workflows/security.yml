name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly scan to catch newly-disclosed CVEs in dependencies even without a code change
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Compile (no tests — CodeQL only needs bytecode, not a live GeoServer)
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run OWASP Dependency-Check
        # NVD_API_KEY is configured (Settings > Secrets and variables > Actions), but the NVD feed
        # itself remains flaky in ways outside this repo's control: freshly-issued keys can take a
        # while to activate (still 403/404 right after creation — confirmed on this repo), and the
        # feed has occasional outages/rate-limiting even with a valid key. continue-on-error keeps
        # a transient NVD problem from blocking unrelated CI/merges; when it DOES succeed, a real
        # high-severity finding still surfaces via the SARIF upload to the Security tab below.
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:9.2.0:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -Dformats=HTML,SARIF \
            -DfailBuildOnCVSS=9

      - name: Upload Dependency-Check SARIF to code scanning
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif

      - name: Upload Dependency-Check HTML report
        if: always() && hashFiles('target/dependency-check-report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
