name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17, 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Start GeoServer + PostGIS (docker-compose)
        run: docker compose up -d

      - name: Wait for GeoServer to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -u admin:geoserver http://localhost:8100/geoserver/rest/about/version.json > /dev/null; then
              echo "GeoServer is up"
              exit 0
            fi
            echo "Waiting for GeoServer... ($i/60)"
            sleep 5
          done
          echo "GeoServer did not become ready in time"
          docker compose logs
          exit 1

      - name: Ensure a default workspace exists
        # A truly fresh kartoza/geoserver instance (this repo's docker-compose.yml, no RECIPE/
        # sample-data env vars set) has zero workspaces out of the box — GET /rest/workspaces/default
        # 404s indefinitely, it's not a startup-timing thing (confirmed: still 404 after 60
        # attempts / 5 minutes on this repo's first CI run). WorkspaceManagerIntegrationTest and
        # NamespaceManagerIntegrationTest both call getDefault() in @BeforeAll to remember-and-restore
        # whatever was already default, which only makes sense once at least one workspace exists.
        # Every local dev setup that's actually been used for a while already has one lying around
        # (that's why this never surfaced outside a brand-new CI runner); create one here so CI
        # matches that same "already-used-at-least-once" baseline instead of a true day-zero install.
        run: |
          if ! curl -sf -u admin:geoserver http://localhost:8100/geoserver/rest/workspaces/default.json > /dev/null; then
            echo "No default workspace yet — creating one"
            curl -sf -u admin:geoserver -X POST -H "Content-Type: application/json" \
              -d '{"workspace":{"name":"bootstrap"}}' \
              http://localhost:8100/geoserver/rest/workspaces
            curl -sf -u admin:geoserver -X PUT -H "Content-Type: application/json" \
              -d '{"workspace":{"name":"bootstrap"}}' \
              http://localhost:8100/geoserver/rest/workspaces/default
          fi

      - name: mvn clean verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      # The examples module is a separate Maven project, so `mvn verify` above never touches it.
      # An API change in the library can therefore leave it uncompilable without CI noticing —
      # which is exactly what happened when closed-set fields became enums in #29 and
      # Ex10_Importer kept passing a String to ImportTaskUpdate. Install the freshly built
      # library first so the examples compile against THIS commit rather than the last release
      # on Maven Central.
      - name: Compile examples against the freshly built library
        if: matrix.java == '17'
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests install
          mvn --batch-mode --no-transfer-progress -f examples/pom.xml -DskipTests compile

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.java == '8'
        # Pinned to a commit SHA rather than a moving tag: a third-party action that
        # receives SONAR/Codecov-adjacent tokens should not be able to change under us.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Stop docker-compose
        if: always()
        run: docker compose down -v
