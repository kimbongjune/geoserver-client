name: Release to Maven Central

# Triggered by pushing a tag matching v* (e.g. v1.0.0). Create it with:
#   git tag -a v1.0.0 -m "Release 1.0.0"
#   git push origin v1.0.0
# Requires 4 repo secrets to actually publish — see docs/RELEASE_PREPARATION.md section
# "GitHub Actions 자동화". Without them this fails cleanly at the auth step (no risk of a
# broken partial publish).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify tag matches pom.xml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pom.xml version $POM_VERSION — aborting."
            exit 1
          fi

      - name: Deploy to Maven Central
        run: mvn --batch-mode --no-transfer-progress clean deploy -P release -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
